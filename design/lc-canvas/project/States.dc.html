<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Liquid Climate tile states</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0a0d14}
.lc{font-family:'Inter',system-ui,-apple-system,sans-serif;color:#F4F6FA;-webkit-font-smoothing:antialiased;font-feature-settings:'tnum' 1}
.glass{position:relative;-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.26),0 18px 40px -18px rgba(0,0,0,.6)}
.rim::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(140deg,rgba(255,255,255,.55),rgba(255,255,255,0) 38%,rgba(255,255,255,0) 62%,rgba(255,255,255,.22));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(80px)}
.pulse{animation:lcPulse 1.8s ease-in-out infinite}
@keyframes lcPulse{0%,100%{box-shadow:0 0 0 0 var(--c)}50%{box-shadow:0 0 0 6px transparent,0 0 24px 2px var(--c)}}
.osc{animation:lcOsc 2.6s ease-in-out infinite;transform-origin:center}
@keyframes lcOsc{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
.spinI{animation:lcSpin 2.2s linear infinite;transform-origin:center}
@keyframes lcSpin{to{transform:rotate(360deg)}}
.bob{animation:lcBob 2.2s ease-in-out infinite}
@keyframes lcBob{0%,100%{transform:translateY(-2px)}50%{transform:translateY(2px)}}
@media (prefers-reduced-motion:reduce){.pulse,.osc,.spinI,.bob{animation:none}}
</style>
</helmet>
<div class="lc" style="width: 900px; height: 420px; position: relative; overflow: hidden; background: #0a0d14; padding: 32px; box-sizing: border-box; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-content: start">
  <div class="orb" aria-hidden="true" style="width: 420px; height: 420px; left: -80px; top: -120px; background-color: #24324a; opacity: 0.8"></div>
  <div class="orb" aria-hidden="true" style="width: 380px; height: 380px; right: -60px; bottom: -160px; background-color: #1d3a3a; opacity: 0.7"></div>
  <sc-for list="{{states}}" as="t" hint-placeholder-count="6">
    <article class="glass rim" aria-label="{{t.name}}: {{t.state}}" style="height: 104px; border-radius: 28px; padding: 0 16px; display: flex; align-items: center; gap: 14px; background: {{t.bg}}">
      <span aria-hidden="true" style="width: 54px; height: 54px; flex: none; border-radius: 18px; border: 1px solid {{t.bd}}; background: {{t.iconBg}}; display: flex; align-items: center; justify-content: center">
        <svg class="{{t.anim}}" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{t.icon}}"></path></svg>
      </span>
      <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 3px">
        <span style="font-size: 12px; font-weight: 500; color: {{t.labelCol}}">{{t.state}}</span>
        <span style="font-size: 16px; font-weight: 600">{{t.name}}</span>
        <span style="font-size: 12.5px; color: rgba(235,240,248,0.72); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.sub}}</span>
      </div>
      <span style="font-size: 26px; font-weight: 300; letter-spacing: -0.03em">{{t.big}}</span>
    </article>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":900,"height":420}}'>
class Component extends DCLogic {
  rgba(hex, a) {
    var n = parseInt(hex.slice(1), 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }
  renderVals() {
    var self = this;
    var I = {
      snow: 'M2 12h20 M12 2v20 M20 16l-4-4 4-4 M4 8l4 4-4 4 M16 4l-4 4-4-4 M8 20l4-4 4 4',
      drop: 'M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z',
      fan: 'M10.827 16.379a6.082 6.082 0 0 1-8.618-7.002l5.412 1.45a6.082 6.082 0 0 1 7.002-8.618l-1.45 5.412a6.082 6.082 0 0 1 8.618 7.002l-5.412-1.45a6.082 6.082 0 0 1-7.002 8.618l1.45-5.412Z M12 12v.01',
      door: 'M13 4h3a2 2 0 0 1 2 2v14 M2 20h3 M13 20h9 M10 12v.01 M13 4.562v16.157a1 1 0 0 1-1.242.97L5 20V5.562a2 2 0 0 1 1.515-1.94l4-1A2 2 0 0 1 13 4.561Z',
      alert: 'M21.73 18l-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z M12 9v4 M12 17h.01',
      cloud: 'M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z M12 12v3 M12 18h.01'
    };
    var rows = [
      { state: 'Cooling', name: 'Bedroom', sub: '24.0° inside', big: '21.0°', c: '#5ab0ff', icon: I.snow, anim: '', label: '#9fd0ff' },
      { state: 'Drying', name: 'Living Room', sub: '66% humidity', big: '--', c: '#40d3c8', icon: I.drop, anim: '', label: '#8be8e1' },
      { state: 'Fan only', name: 'Nail Salon', sub: 'Fan 4', big: '--', c: '#d5dce6', icon: I.fan, anim: 'spinI', label: '#e6ebf2' },
      { state: 'Paused', name: 'Living Room', sub: 'Patio door open', big: '--', c: '#facc15', icon: I.door, anim: '', label: '#fde68a' },
      { state: 'Error', name: 'Bedroom', sub: 'Outdoor unit', big: '', c: '#f87171', icon: I.alert, anim: '', label: '#fca5a5' },
      { state: 'Cloud limit', name: 'All units', sub: '12 calls left today', big: '', c: '#ffb067', icon: I.cloud, anim: '', label: '#ffc78a' }
    ];
    return {
      states: rows.map(function (r) {
        return {
          state: r.state, name: r.name, sub: r.sub, big: r.big, icon: r.icon, anim: r.anim, labelCol: r.label,
          bg: 'rgba(22,25,33,0.5)', bd: self.rgba(r.c, 0.45), iconBg: self.rgba(r.c, 0.24)
        };
      })
    };
  }
}
</script>
</body>
</html>
