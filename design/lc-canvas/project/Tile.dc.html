<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Liquid Climate compact tile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b0e14}
.lc{font-family:'Inter',system-ui,-apple-system,sans-serif;color:#F4F6FA;-webkit-font-smoothing:antialiased;font-feature-settings:'tnum' 1}
.tile{position:relative;background:rgba(22,25,33,.5);-webkit-backdrop-filter:blur(30px) saturate(170%);backdrop-filter:blur(30px) saturate(170%);border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 20px 40px -20px rgba(0,0,0,.6)}
.tile::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(140deg,rgba(255,255,255,.45),rgba(255,255,255,0) 35%,rgba(255,255,255,0) 65%,rgba(255,255,255,.15));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
button{font:inherit;color:inherit;cursor:pointer;margin:0;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.07)}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
button:disabled{cursor:default}
.press{transition:transform .3s cubic-bezier(.3,1.7,.5,1),background-color .5s ease,border-color .5s ease}
.press:active{transform:scale(.9)}
.flick{animation:lcFlick 2.4s ease-in-out infinite;transform-origin:50% 90%}
@keyframes lcFlick{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.06,.97) rotate(-3deg)}60%{transform:scale(.97,1.05) rotate(3deg)}}
@media (prefers-reduced-motion:reduce){.flick{animation:none}}
</style>
</helmet>
<div class="lc" style="width: 460px; height: 420px; position: relative; overflow: hidden; background: #0b0e14; display: flex; flex-direction: column; justify-content: center; gap: 10px; padding: 0 32px; box-sizing: border-box">
  <div aria-hidden="true" style="position: absolute; width: 380px; height: 380px; left: -140px; top: 20px; border-radius: 50%; background-color: #24324a; filter: blur(90px); opacity: 0.8"></div>
  <div aria-hidden="true" style="position: absolute; width: 320px; height: 320px; right: -120px; bottom: -80px; border-radius: 50%; background-color: #1d3a3a; filter: blur(90px); opacity: 0.7"></div>
  <sc-for list="{{tiles}}" as="t" hint-placeholder-count="3">
    <article class="tile" aria-label="{{t.name}} climate" style="height: 96px; border-radius: 26px; padding: 0 12px 0 14px; display: flex; align-items: center; gap: 14px">
      <button class="press" onClick="{{t.toggle}}" aria-label="{{t.powerLabel}}" aria-pressed="{{t.on}}" style="width: 50px; height: 50px; flex: none; border-radius: 16px; padding: 0; display: flex; align-items: center; justify-content: center; background: {{t.iconBg}}; border-color: {{t.bd}}">
        <svg class="{{t.iconCls}}" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{t.iconFg}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
      </button>
      <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 3px">
        <span style="font-size: 16px; font-weight: 600; letter-spacing: -0.01em">{{t.name}}</span>
        <span style="font-size: 13px; color: rgba(235,240,248,0.68)">{{t.sub}}</span>
      </div>
      <div style="display: flex; align-items: center; gap: 2px; flex: none">
        <button class="press" onClick="{{t.dec}}" aria-label="Lower target temperature" disabled="{{t.noSp}}" style="width: 44px; height: 44px; border-radius: 50%; padding: 0; display: flex; align-items: center; justify-content: center; opacity: {{t.stepOp}}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
        </button>
        <span style="width: 64px; text-align: center; font-size: 24px; font-weight: 300; letter-spacing: -0.03em">{{t.target}}</span>
        <button class="press" onClick="{{t.inc}}" aria-label="Raise target temperature" disabled="{{t.noSp}}" style="width: 44px; height: 44px; border-radius: 50%; padding: 0; display: flex; align-items: center; justify-content: center; opacity: {{t.stepOp}}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14 M12 5v14"></path></svg>
        </button>
      </div>
    </article>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":460,"height":420}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      tiles: [
        { name: 'Living Room', mode: 'heat', last: 'heat', target: 16.5, room: 17.3 },
        { name: 'Bedroom', mode: 'heat', last: 'heat', target: 21, room: 24 },
        { name: 'Nail Salon', mode: 'off', last: 'heat', target: 21, room: 25 }
      ]
    };
    this.M = {
      off: { color: '#9aa3b2', icon: 'M12 2v10 M18.4 6.6a9 9 0 1 1-12.77.04' },
      heat: { color: '#ff9447', icon: 'M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z' }
    };
  }
  rgba(hex, a) {
    var n = parseInt(hex.slice(1), 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }
  patch(i, p) {
    this.setState({ tiles: this.state.tiles.map(function (t, j) { return j === i ? Object.assign({}, t, p) : t; }) });
  }
  renderVals() {
    var self = this;
    return {
      tiles: this.state.tiles.map(function (t, i) {
        var on = t.mode !== 'off';
        var m = self.M[on ? t.mode : t.last];
        return {
          name: t.name, on: on,
          sub: (on ? 'Heating, ' : 'Off, ') + t.room.toFixed(1) + '° inside',
          target: on ? t.target.toFixed(1) + '°' : '--',
          icon: m.icon,
          iconCls: on ? 'flick' : '',
          iconBg: on ? self.rgba(m.color, 0.24) : 'rgba(255,255,255,0.06)',
          bd: on ? self.rgba(m.color, 0.45) : 'rgba(255,255,255,0.08)',
          iconFg: on ? '#ffffff' : 'rgba(235,240,248,0.55)',
          powerLabel: (on ? 'Turn off ' : 'Turn on ') + t.name,
          noSp: !on, stepOp: on ? 1 : 0.3,
          toggle: function () { self.patch(i, { mode: on ? 'off' : t.last }); },
          dec: function () { if (on) self.patch(i, { target: Math.max(10, t.target - 0.5) }); },
          inc: function () { if (on) self.patch(i, { target: Math.min(30, t.target + 0.5) }); }
        };
      })
    };
  }
}
</script>
</body>
</html>
