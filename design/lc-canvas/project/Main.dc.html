<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Liquid Climate dial card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b0e14}
.lc{font-family:'Inter',system-ui,-apple-system,sans-serif;color:#F4F6FA;-webkit-font-smoothing:antialiased;font-feature-settings:'tnum' 1}
.rim::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(140deg,rgba(255,255,255,.5),rgba(255,255,255,0) 35%,rgba(255,255,255,0) 65%,rgba(255,255,255,.18));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
button{font:inherit;color:inherit;cursor:pointer;margin:0;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.07)}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
button:disabled{cursor:default}
.press{transition:transform .28s cubic-bezier(.3,1.7,.5,1),background-color .5s ease,border-color .5s ease}
.press:active{transform:scale(.93)}
.tint{transition:background-color .9s ease,opacity .9s ease}
.pt{position:absolute;border-radius:50%;opacity:0;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
.pt-off{display:none}
.pt-heat,.pt-heat_cool{bottom:-8px;animation-name:lcRise}
.pt-cool{top:-8px;animation-name:lcFall}
.pt-dry{top:-8px;animation-name:lcDrip;border-radius:50% 50% 50% 50%/60% 60% 40% 40%}
.pt-fan_only{bottom:40%;animation-name:lcDrift}
@keyframes lcRise{0%{transform:translateY(0) scale(.5);opacity:0}20%{opacity:.55}100%{transform:translate(10px,-230px) scale(1.1);opacity:0}}
@keyframes lcFall{0%{transform:translate(0,0);opacity:0}20%{opacity:.6}50%{transform:translate(8px,110px)}100%{transform:translate(-6px,230px);opacity:0}}
@keyframes lcDrip{0%{transform:translateY(0) scaleY(.8);opacity:0}15%{opacity:.55}100%{transform:translateY(230px) scaleY(1.3);opacity:0}}
@keyframes lcDrift{0%{transform:translateX(-70px);opacity:0}25%{opacity:.45}100%{transform:translateX(150px);opacity:0}}
.spin{transform-box:fill-box;transform-origin:center;animation:lcSpin linear infinite}
@keyframes lcSpin{to{transform:rotate(360deg)}}
.osc{animation:lcOsc 1.6s ease-in-out infinite;transform-origin:center}
.osc-slow{animation:lcOsc 3.4s ease-in-out infinite;transform-origin:center}
@keyframes lcOsc{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(16deg)}}
.climb{animation:lcClimb 1.9s ease-in-out infinite}
@keyframes lcClimb{0%{transform:translateY(3px);opacity:.4}50%{opacity:1}100%{transform:translateY(-3px);opacity:.4}}
.fillA{transform-origin:left;animation:lcFillA 1.5s linear forwards}
.fillB{transform-origin:left;animation:lcFillB 1.5s linear forwards}
@keyframes lcFillA{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes lcFillB{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.popA{animation:lcPopA .35s cubic-bezier(.3,1.6,.5,1)}
.popB{animation:lcPopB .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes lcPopA{0%{transform:scale(.95)}100%{transform:scale(1)}}
@keyframes lcPopB{0%{transform:scale(.95)}100%{transform:scale(1)}}
.m-subtle .pt,.m-minimal .pt{display:none}
.m-minimal .spin,.m-minimal .osc,.m-minimal .osc-slow,.m-minimal .climb{animation:none}
@media (prefers-reduced-motion:reduce){.pt{display:none}.spin,.osc,.osc-slow,.climb,.popA,.popB{animation:none}}
</style>
</helmet>
<div class="lc m-{{motion}}" style="width: 540px; height: 1060px; position: relative; overflow: hidden; background: #0b0e14; display: flex; align-items: center; justify-content: center">
  <div aria-hidden="true" style="position: absolute; width: 520px; height: 520px; left: -160px; top: 80px; border-radius: 50%; background-color: #24324a; filter: blur(90px); opacity: 0.8"></div>
  <div aria-hidden="true" style="position: absolute; width: 460px; height: 460px; right: -160px; bottom: 60px; border-radius: 50%; background-color: #1d3a3a; filter: blur(90px); opacity: 0.7"></div>

  <section aria-label="Living Room climate" onPointerMove="{{hover}}" onPointerLeave="{{leave}}" class="rim" style="position: relative; width: 444px; box-sizing: border-box; padding: 22px; border-radius: 40px; background: rgba(22,25,33,0.5); backdrop-filter: blur({{blur}}px) saturate(170%); border: 1px solid rgba(255,255,255,0.12); box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), 0 40px 80px -24px rgba(0,0,0,0.65); display: flex; flex-direction: column; gap: 16px; overflow: hidden">
    <div class="tint" aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background-color: {{color}}; opacity: {{tintOp}}; pointer-events: none"></div>
    <div aria-hidden="true" style="position: absolute; inset: 0; border-radius: inherit; background: radial-gradient(circle at {{mx}}% {{my}}%, rgba(255,255,255,0.1), rgba(255,255,255,0) 40%); opacity: {{lightOp}}; transition: opacity 0.4s ease; pointer-events: none"></div>

    <header style="position: relative; display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <h2 style="margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.02em">Living Room</h2>
        <span style="font-size: 13px; color: rgba(235,240,248,0.7)">{{headerSub}}</span>
      </div>
      <button class="press" onClick="{{togglePower}}" aria-label="{{powerLabel}}" aria-pressed="{{isOn}}" style="width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; padding: 0; background: {{powerBg}}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v10 M18.4 6.6a9 9 0 1 1-12.77.04"></path></svg>
      </button>
    </header>

    <div style="position: relative; width: 400px; height: 400px">
      <div aria-hidden="true" style="position: absolute; left: 95px; top: 95px; width: 210px; height: 210px; border-radius: 50%; overflow: hidden; -webkit-mask-image: radial-gradient(circle, #000 50%, transparent 70%); mask-image: radial-gradient(circle, #000 50%, transparent 70%)">
        <sc-for list="{{parts}}" as="p" hint-placeholder-count="14">
          <span class="{{p.cls}}" style="left: {{p.left}}%; width: {{p.size}}px; height: {{p.size}}px; animation-delay: {{p.delay}}s; animation-duration: {{p.dur}}s; background-color: {{p.col}}"></span>
        </sc-for>
      </div>
      <svg role="slider" aria-label="Target temperature. Drag the inner ring for temperature, the outer ring for fan speed." aria-valuemin="10" aria-valuemax="30" aria-valuenow="{{target}}" viewBox="0 0 400 400" width="400" height="400" onPointerDown="{{down}}" onPointerMove="{{move}}" onPointerUp="{{up}}" onPointerCancel="{{up}}" style="position: absolute; inset: 0; touch-action: none; cursor: grab">
        <path d="{{fanDimD}}" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="10" stroke-linecap="round"></path>
        <path d="{{fanLitD}}" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="10" stroke-linecap="round" opacity="{{fanOp}}"></path>
        <circle class="spin" cx="200" cy="200" r="154" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.2" stroke-dasharray="1.5 9" stroke-linecap="round" opacity="{{spinOp}}" style="animation-duration: {{spinDur}}"></circle>
        <path d="{{trackD}}" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="10" stroke-linecap="round"></path>
        <path d="{{progD}}" fill="none" stroke="{{color}}" stroke-width="10" stroke-linecap="round" opacity="{{progOp}}" style="transition: stroke .8s"></path>
        <path d="{{tickDimD}}" fill="none" stroke="rgba(255,255,255,0.24)" stroke-width="1.2" stroke-linecap="round"></path>
        <path d="{{tickLitD}}" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.85"></path>
        <circle cx="{{roomX}}" cy="{{roomY}}" r="3.5" fill="#ffffff" opacity="0.7"></circle>
        <circle cx="{{knobX}}" cy="{{knobY}}" r="13" fill="#ffffff" stroke="{{color}}" stroke-width="3.5" opacity="{{knobOp}}" style="filter: drop-shadow(0 2px 6px rgba(0,0,0,0.45)); transition: stroke .8s"></circle>
      </svg>
      <sc-for list="{{fanLabels}}" as="l" hint-placeholder-count="7">
        <span aria-hidden="true" style="position: absolute; left: {{l.x}}px; top: {{l.y}}px; width: 20px; margin-left: -10px; margin-top: -7px; text-align: center; font-size: 10px; font-weight: 600; color: #ffffff; opacity: {{l.op}}; pointer-events: none">{{l.t}}</span>
      </sc-for>
      <sc-for list="{{tickLabels}}" as="l" hint-placeholder-count="3">
        <span aria-hidden="true" style="position: absolute; left: {{l.x}}px; top: {{l.y}}px; width: 24px; margin-left: -12px; margin-top: -7px; text-align: center; font-size: 10px; color: rgba(235,240,248,0.55); pointer-events: none">{{l.t}}</span>
      </sc-for>

      <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-bottom: 24px; box-sizing: border-box; pointer-events: none">
        <div class="{{popCls}}" style="display: flex; align-items: flex-start">
          <span style="font-size: 72px; font-weight: 200; letter-spacing: -0.04em; line-height: 1">{{big}}</span>
          <sc-if value="{{showDeg}}" hint-placeholder-val="{{ true }}">
            <span style="font-size: 28px; font-weight: 300; margin-top: 6px; color: rgba(235,240,248,0.75)">°</span>
          </sc-if>
        </div>
        <div style="position: relative; margin-top: 10px; height: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center">
          <span style="font-size: 13px; color: rgba(235,240,248,0.7)">{{centerSub}}</span>
          <sc-if value="{{pending}}" hint-placeholder-val="{{ false }}">
            <span aria-hidden="true" style="position: absolute; left: 50%; bottom: -8px; width: 56px; margin-left: -28px; height: 2px; border-radius: 1px; background: rgba(255,255,255,0.15); overflow: hidden">
              <span class="{{fillCls}}" style="display: block; width: 100%; height: 100%; background-color: #ffffff"></span>
            </span>
          </sc-if>
        </div>
      </div>

      <div style="position: absolute; left: 0; right: 0; bottom: 8px; display: flex; justify-content: center; gap: 76px">
        <button class="press" onClick="{{dec}}" aria-label="Lower target temperature" disabled="{{noSp}}" style="width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; padding: 0; opacity: {{stepOp}}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
        </button>
        <button class="press" onClick="{{inc}}" aria-label="Raise target temperature" disabled="{{noSp}}" style="width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; padding: 0; opacity: {{stepOp}}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14 M12 5v14"></path></svg>
        </button>
      </div>
    </div>

    <div role="group" aria-label="Mode" style="position: relative; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{modes}}" as="m" hint-placeholder-count="6">
        <button class="press" onClick="{{m.pick}}" aria-pressed="{{m.pressed}}" style="height: 60px; border-radius: 18px; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; background: {{m.bg}}; border-color: {{m.bd}}">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="{{m.fg}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{m.icon}}"></path></svg>
          <span style="font-size: 11px; font-weight: 500; color: {{m.fg}}">{{m.label}}</span>
        </button>
      </sc-for>
    </div>

    <div style="position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="3">
        <button class="press" onClick="{{c.cycle}}" aria-label="{{c.aria}}" style="height: 52px; border-radius: 16px; padding: 0 12px; display: flex; align-items: center; gap: 9px; text-align: left; min-width: 0; background: {{c.bg}}; border-color: {{c.bd}}">
          <svg class="{{c.iconCls}}" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; opacity: 0.85"><path d="{{c.icon}}"></path></svg>
          <span style="display: flex; flex-direction: column; gap: 1px; min-width: 0">
            <span style="font-size: 11px; color: rgba(235,240,248,0.6)">{{c.label}}</span>
            <span style="font-size: 13px; font-weight: 600">{{c.value}}</span>
          </span>
        </button>
      </sc-for>
    </div>

    <div style="position: relative; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid rgba(255,255,255,0.09); padding-top: 14px">
      <div style="display: flex; flex-direction: column; gap: 3px">
        <span style="font-size: 18px; font-weight: 400">40%</span>
        <span style="font-size: 11.5px; color: rgba(235,240,248,0.6)">Humidity</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 3px">
        <span style="font-size: 18px; font-weight: 400">6°</span>
        <span style="font-size: 11.5px; color: rgba(235,240,248,0.6)">Outside</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 3px">
        <span style="font-size: 18px; font-weight: 400">1.7<span style="font-size: 12px; color: rgba(235,240,248,0.65)"> kWh</span></span>
        <span style="font-size: 11.5px; color: rgba(235,240,248,0.6)">Today</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 3px">
        <span style="font-size: 18px; font-weight: 400; color: {{apiCol}}">{{api}}</span>
        <span style="font-size: 11.5px; color: rgba(235,240,248,0.6)">Cloud calls left</span>
      </div>
    </div>

    <div style="position: relative; display: flex; flex-direction: column; border-top: 1px solid rgba(255,255,255,0.09)">
      <div style="display: flex; justify-content: space-between; padding: 12px 0; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,0.06)">
        <span style="color: rgba(235,240,248,0.7)">Automation</span>
        <span style="font-weight: 500">Stand-by</span>
      </div>
      <div style="display: flex; justify-content: space-between; padding: 12px 0 0; font-size: 13px">
        <span style="color: rgba(235,240,248,0.7)">Window pause</span>
        <span style="font-weight: 500">Armed</span>
      </div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tint":{"editor":"range","default":0.09,"min":0,"max":0.3,"step":0.01,"section":"Glass"},"blur":{"editor":"range","default":30,"min":8,"max":60,"step":1,"unit":"px","section":"Glass"},"motion":{"editor":"enum","options":["rich","subtle","minimal"],"default":"rich","section":"Motion"},"$preview":{"width":540,"height":1060}}'>

    this.lastMode = 'heat';

    this.I = {
      power: 'M12 2v10 M18.4 6.6a9 9 0 1 1-12.77.04',
      flame: 'M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z',
      snow: 'M2 12h20 M12 2v20 M20 16l-4-4 4-4 M4 8l4 4-4 4 M16 4l-4 4-4-4 M8 20l4-4 4 4',
      auto: 'M21 16l-4 4-4-4 M17 20V4 M3 8l4-4 4 4 M7 4v16',
      drop: 'M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z',
      fan: 'M10.827 16.379a6.082 6.082 0 0 1-8.618-7.002l5.412 1.45a6.082 6.082 0 0 1 7.002-8.618l-1.45 5.412a6.082 6.082 0 0 1 8.618 7.002l-5.412-1.45a6.082 6.082 0 0 1-7.002 8.618l1.45-5.412Z M12 12v.01',
      swingV: 'M12 2v20 M8 18l4 4 4-4 M8 6l4-4 4 4',
      swingH: 'M2 12h20 M18 8l4 4-4 4 M6 8l-4 4 4 4',
      boost: 'M17 11l-5-5-5 5 M17 18l-5-5-5 5',
      away: 'M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4 M16 17l5-5-5-5 M21 12H9',
      none: 'M12 3a9 9 0 1 0 0 18 9 9 0 1 0 0-18z'
    };
    this.MODES = [
      { id: 'off', label: 'Off', verb: 'Off', color: '#9aa3b2', icon: this.I.power },
      { id: 'heat', label: 'Heat', verb: 'Heating', color: '#ff9447', icon: this.I.flame },
      { id: 'cool', label: 'Cool', verb: 'Cooling', color: '#5ab0ff', icon: this.I.snow },
      { id: 'heat_cool', label: 'Auto', verb: 'Auto', color: '#a99cff', icon: this.I.auto },
      { id: 'dry', label: 'Dry', verb: 'Drying', color: '#40d3c8', icon: this.I.drop },
      { id: 'fan_only', label: 'Fan', verb: 'Fan only', color: '#d5dce6', icon: this.I.fan }

    this.parts = [];
    for (var i = 0; i < 14; i++) {

  componentWillUnmount() { clearTimeout(this.timer); }
  rgba(hex, a) {

    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }
  pt(r, a) { var t = a * Math.PI / 180; return [200 + r * Math.cos(t), 200 + r * Math.sin(t)]; }
  arc(r, a0, a1) {

    var p = this.pt(r, a0), q = this.pt(r, a1);
    return 'M ' + p[0].toFixed(2) + ' ' + p[1].toFixed(2) + ' A ' + r + ' ' + r + ' 0 ' + (a1 - a0 > 180 ? 1 : 0) + ' 1 ' + q[0].toFixed(2) + ' ' + q[1].toFixed(2) + ' ';
  }
  frac(v) { return (v - 10) / 20; }
  hasSp() { var m = this.state.mode; return m === 'heat' || m === 'cool' || m === 'heat_cool'; }
  local(e) {
    var r = e.currentTarget.getBoundingClientRect();
    var s = 400 / r.width;
    return [(e.clientX - r.left) * s, (e.clientY - r.top) * s];
  }
  relFrac(x, y) {
    var a = Math.atan2(y - 200, x - 200) * 180 / Math.PI;
    var rel = ((a - 135) % 360 + 360) % 360;
    if (rel > 270) rel = rel > 315 ? 0 : 270;
    return rel / 270;
  }
  apply(zone, x, y) {
    var f = this.relFrac(x, y);
    if (zone === 'temp') {
      var v = Math.round((10 + f * 20) * 2) / 2;
      if (v !== this.state.target) this.setState(function (s) { return { target: v, tkey: s.tkey + 1 }; });
    } else {
      var fan = this.FANS[Math.min(6, Math.floor(f * 7))];
      if (fan !== this.state.fan) this.setState({ fan: fan });
    }
  }
  commit() {
    var self = this;
    this.setState(function (s) { return { pending: true, key: s.key + 1 }; });
    clearTimeout(this.timer);
    this.timer = setTimeout(function () {
      self.setState(function (s) { return { pending: false, api: Math.max(0, s.api - 1) }; });
    }, 1500);
  }
  step(d) {
    if (!this.hasSp()) return;
    var v = Math.min(30, Math.max(10, this.state.target + d));
    this.setState(function (s) { return { target: v, tkey: s.tkey + 1 }; });
    this.commit();
  }
  cycle(key, list) {
    var i = list.indexOf(this.state[key]);
    var o = {}; o[key] = list[(i + 1) % list.length];
    this.setState(o);
    this.commit();
  }
  renderVals() {
    var self = this, s = this.state, I = this.I;
    var mode = this.MODES.filter(function (m) { return m.id === s.mode; })[0];
    var on = s.mode !== 'off';
    var sp = this.hasSp();
    var color = mode.color;

    var aT = 135 + this.frac(s.target) * 270;
    var knob = this.pt(138, aT);
    var room = this.pt(138, 135 + this.frac(this.ROOM) * 270);

    var dim = '', lit = '', tl = [];
    for (var t = 10; t <= 30; t++) {
      var a = 135 + (t - 10) / 20 * 270;
      var major = t % 5 === 0;
      var p1 = this.pt(major ? 111 : 116, a), p2 = this.pt(123, a);
      var seg = 'M ' + p1[0].toFixed(1) + ' ' + p1[1].toFixed(1) + ' L ' + p2[0].toFixed(1) + ' ' + p2[1].toFixed(1) + ' ';
      if (sp && t <= s.target) lit += seg; else dim += seg;
      if (t % 10 === 0) { var lp = this.pt(99, a); tl.push({ x: lp[0], y: lp[1], t: String(t) }); }
    }

    var fi = this.FANS.indexOf(s.fan);
    var segW = (270 - 6 * 4) / 7;
    var fanDim = '', fanLit = '', fl = [];
    for (var i = 0; i < 7; i++) {
      var a0 = 135 + i * (segW + 4), a1 = a0 + segW;
      var isLit = (fi === 0 && i === 0) || (fi > 0 && i > 0 && i <= fi);
      if (isLit) fanLit += this.arc(170, a0, a1); else fanDim += this.arc(170, a0, a1);
      var q = this.pt(190, (a0 + a1) / 2);
      fl.push({ x: q[0], y: q[1], t: this.FANL[i], op: i === fi ? 1 : 0.4 });
    }

    var speed = this.FANSPEED[s.fan] || 1;
    var parts = this.parts.map(function (p) {
      return { left: p.left, delay: p.delay, size: p.size, dur: (p.base * speed).toFixed(2), col: color, cls: 'pt pt-' + s.mode };
    });

    var modes = this.MODES.map(function (m) {
      var act = m.id === s.mode;
      return {
        label: m.label, icon: m.icon, pressed: act,
        bg: act ? self.rgba(m.color, 0.2) : 'rgba(255,255,255,0.05)',
        bd: act ? self.rgba(m.color, 0.45) : 'rgba(255,255,255,0.08)',
        fg: act ? '#ffffff' : 'rgba(235,240,248,0.72)',
        pick: function () {
          if (m.id !== 'off') self.lastMode = m.id;
          self.setState({ mode: m.id });
          self.commit();
        }
      };
    });

    var VN = { stop: 'Fixed', swing: 'Swing', windnice: 'Comfort' };
    var HN = { stop: 'Fixed', swing: 'Swing' };
    var PN = { none: 'None', boost: 'Boost', away: 'Away' };
    var chip = function (label, value, icon, active, cls, fn) {
      return {
        label: label, value: value, icon: icon, iconCls: cls, cycle: fn,
        aria: label + ' airflow: ' + value,
        bg: active ? 'rgba(255,255,255,0.14)' : 'rgba(255,255,255,0.05)',
        bd: active ? 'rgba(255,255,255,0.28)' : 'rgba(255,255,255,0.08)'
      };
    };
    var chips = [
      chip('Vertical', VN[s.swingV], I.swingV, s.swingV !== 'stop', s.swingV === 'swing' ? 'osc' : (s.swingV === 'windnice' ? 'osc-slow' : ''), function () { self.cycle('swingV', ['stop', 'swing', 'windnice']); }),
      chip('Horizontal', HN[s.swingH], I.swingH, s.swingH !== 'stop', s.swingH === 'swing' ? 'osc' : '', function () { self.cycle('swingH', ['stop', 'swing']); }),
      chip('Preset', PN[s.preset], s.preset === 'away' ? I.away : (s.preset === 'boost' ? I.boost : I.none), s.preset !== 'none', s.preset === 'boost' ? 'climb' : '', function () { self.cycle('preset', ['none', 'boost', 'away']); })
    ];
    chips[2].aria = 'Preset: ' + PN[s.preset];

    return {
      motion: this.props.motion || 'rich',
      mx: s.mx, my: s.my,
      lightOp: s.lit && this.props.motion !== 'minimal' ? 1 : 0,
      hover: function (e) {
        if (e.pointerType && e.pointerType !== 'mouse') return;
        var r = e.currentTarget.getBoundingClientRect();
        self.setState({ lit: true, mx: Math.round((e.clientX - r.left) / r.width * 100), my: Math.round((e.clientY - r.top) / r.height * 100) });
      },
      leave: function () { self.setState({ lit: false }); },
      blur: this.props.blur != null ? this.props.blur : 30,
      color: color,
      tintOp: on ? tint : 0,
      isOn: on,
      powerLabel: on ? 'Turn off' : 'Turn on',
      powerBg: on ? this.rgba(color, 0.28) : 'rgba(255,255,255,0.07)',
      headerSub: on ? mode.verb + (sp ? ' to ' + s.target.toFixed(1) + '°' : '') : 'Off',
      target: s.target,
      trackD: this.arc(138, 135, 405),
      progD: this.arc(138, 135, aT),
      progOp: sp ? 1 : 0,
      knobX: knob[0].toFixed(1), knobY: knob[1].toFixed(1), knobOp: sp ? 1 : 0,
      roomX: room[0].toFixed(1), roomY: room[1].toFixed(1),
      tickDimD: dim, tickLitD: lit || 'M 0 0',
      tickLabels: tl,
      fanDimD: fanDim || 'M 0 0', fanLitD: fanLit || 'M 0 0', fanOp: on ? 1 : 0.3,
      fanLabels: fl,
      spinDur: this.SPIN[s.fan] || '7s', spinOp: on ? 1 : 0,
      parts: parts,
      big: sp ? s.target.toFixed(1) : (on ? this.ROOM.toFixed(1) : 'Off'),
      showDeg: on,
      popCls: s.tkey % 2 ? 'popA' : 'popB',
      centerSub: s.pending ? 'Sending' : (sp || !on ? 'Inside ' + this.ROOM.toFixed(1) + '°' : 'Inside'),
      noSp: !sp, stepOp: sp ? 1 : 0.3,
      dec: function () { self.step(-0.5); },
      inc: function () { self.step(0.5); },
      togglePower: function () {
        self.setState({ mode: s.mode === 'off' ? self.lastMode : 'off' });
        self.commit();
      },
      pending: s.pending,
      fillCls: s.key % 2 ? 'fillA' : 'fillB',
      modes: modes,
      chips: chips,
      api: s.api,
      apiCol: s.api < 30 ? '#ffb067' : '#F4F6FA',
      down: function (e) {
        var p = self.local(e);
        var d = Math.sqrt((p[0] - 200) * (p[0] - 200) + (p[1] - 200) * (p[1] - 200));
        var zone = d > 156 && d < 200 ? 'fan' : (d > 104 && d <= 156 ? 'temp' : null);
        if (!zone || (zone === 'temp' && !self.hasSp())) return;
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch (x) {}
        self.drag = zone;
        self.apply(zone, p[0], p[1]);
      },
      move: function (e) {
        if (!self.drag) return;
        var p = self.local(e);
        self.apply(self.drag, p[0], p[1]);
      },
      up: function () {
        if (!self.drag) return;
        self.drag = null;
        self.commit();
      }
    };
  }
}
</script>
</body>
