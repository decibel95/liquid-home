<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Light badge</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b0e14}
.lc{font-family:'Inter',system-ui,-apple-system,sans-serif;color:#F4F6FA;-webkit-font-smoothing:antialiased;font-feature-settings:'tnum' 1}
.g-dark{--lc-fg:#f4f6fa;--lc-fg2:rgba(235,240,248,.78);--lc-bg:rgba(18,20,26,.78);--lc-edge:rgba(255,255,255,.12);--lc-shine:rgba(255,255,255,.22);--lc-bright:#ffffff;--lc-rim:rgba(255,255,255,.5);--lc-rim2:rgba(255,255,255,.18);color:var(--lc-fg)}
.g-light{--lc-fg:#10141b;--lc-fg2:rgba(16,20,27,.62);--lc-bg:rgba(248,249,252,.72);--lc-edge:rgba(0,0,0,.1);--lc-shine:rgba(255,255,255,.7);--lc-bright:#10141b;--lc-rim:rgba(255,255,255,.9);--lc-rim2:rgba(255,255,255,.4);color:var(--lc-fg)}
.badge{font:inherit;position:relative;box-sizing:border-box;height:36px;min-width:36px;margin:0;display:flex;align-items:center;color:var(--lc-fg);background-color:var(--lc-bg);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid var(--lc-edge);border-radius:18px;box-shadow:inset 0 1px 0 var(--lc-shine),0 12px 28px -14px rgba(0,0,0,.6);text-align:left;cursor:pointer}
.badge:focus-visible{outline:2px solid var(--lc-bright);outline-offset:2px}
.rim::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(140deg,var(--lc-rim),rgba(255,255,255,0) 35%,rgba(255,255,255,0) 65%,var(--lc-rim2));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.pill{max-width:100%;padding:0 12px;gap:8px}
.round{width:36px;padding:0;justify-content:center}
.ic{flex:none;display:flex;align-items:center;justify-content:center;color:var(--lc-bright)}
.pill .ic{width:28px;height:28px;margin-inline-start:-8px;border-radius:50%}
.n{font-size:10px;font-weight:500;line-height:10px;letter-spacing:.1px;color:var(--lc-fg2);white-space:nowrap}
.v{font-size:12px;font-weight:500;line-height:1.2;letter-spacing:.1px;white-space:nowrap}
.orb{position:absolute;border-radius:50%;filter:blur(70px)}
</style>
</helmet>
<div class="lc" style="width: 1000px; height: 620px; position: relative; overflow: hidden; background: #0b0e14; display: grid; grid-template-rows: 1fr 1fr">
  <section style="position: relative; overflow: hidden; padding: 28px 40px; display: flex; flex-direction: column; gap: 12px">
    <div class="orb" aria-hidden="true" style="width: 520px; height: 300px; left: 80px; top: -40px; background-color: #24324a; opacity: 0.8"></div>
    <div class="orb" aria-hidden="true" style="width: 420px; height: 300px; right: 60px; top: 20px; background-color: #1d3a3a; opacity: 0.7"></div>
    <span style="position: relative; font-size: 13px; color: rgba(235,240,248,0.78)">Dark glass. HA badge size (36px). Pill, then round. Numbered as the tiles; orange = derived. 1 and 6 neutral (CHO-1 option B), 8 a group (CHO-4).</span>
    <div style="position: relative; display: flex; flex-wrap: wrap; gap: 10px">
      <sc-for list="{{dk}}" as="b" hint-placeholder-count="8">
        <span style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 11px; font-weight: 600; color: {{b.tagC}}">{{b.tag}}</span><button class="badge pill rim g-dark" aria-label="{{b.aria}}">
          <span class="ic" style="background-color: {{b.tint}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5 M9 18h6 M10 22h4"></path></svg></span>
          <span style="display: flex; flex-direction: column; min-width: 0" aria-hidden="true"><span class="n">{{b.name}}</span><span class="v">{{b.value}}</span></span>
        </button></span>
      </sc-for>
    </div>
    <div style="position: relative; display: flex; flex-wrap: wrap; gap: 10px">
      <sc-for list="{{dk}}" as="b" hint-placeholder-count="8">
        <span style="display: flex; flex-direction: column; align-items: center; gap: 4px"><span style="font-size: 11px; font-weight: 600; color: {{b.tagC}}">{{b.n}}</span><button class="badge round rim g-dark" aria-label="{{b.aria}}" style="background-image: linear-gradient({{b.tint}}, {{b.tint}})">
          <span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5 M9 18h6 M10 22h4"></path></svg></span>
        </button></span>
      </sc-for>
    </div>
  </section>
  <section style="position: relative; background: #e7e9ee; color: #10141b; padding: 28px 40px; display: flex; flex-direction: column; gap: 12px">
    <span style="font-size: 13px; color: rgba(16,20,27,0.62)">Light glass. Off and unavailable use the status off grey, as the climate badge does.</span>
    <div style="display: flex; flex-wrap: wrap; gap: 10px">
      <sc-for list="{{lt}}" as="b" hint-placeholder-count="8">
        <span style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 11px; font-weight: 600; color: {{b.tagC}}">{{b.tag}}</span><button class="badge pill rim g-light" aria-label="{{b.aria}}">
          <span class="ic" style="background-color: {{b.tint}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5 M9 18h6 M10 22h4"></path></svg></span>
          <span style="display: flex; flex-direction: column; min-width: 0" aria-hidden="true"><span class="n">{{b.name}}</span><span class="v">{{b.value}}</span></span>
        </button></span>
      </sc-for>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 10px">
      <sc-for list="{{lt}}" as="b" hint-placeholder-count="8">
        <span style="display: flex; flex-direction: column; align-items: center; gap: 4px"><span style="font-size: 11px; font-weight: 600; color: {{b.tagC}}">{{b.n}}</span><button class="badge round rim g-light" aria-label="{{b.aria}}" style="background-image: linear-gradient({{b.tint}}, {{b.tint}})">
          <span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5 M9 18h6 M10 22h4"></path></svg></span>
        </button></span>
      </sc-for>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1000,"height":620}}'>
class Component extends DCLogic {
  rgba(hex, a) {
    var n = parseInt(hex.slice(1), 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }
  list(G) {
    var self = this;
    var kit = G === 'dark' ? '#ff4070' : '#e51f5c', neu = G === 'dark' ? '#d5dce6' : '#64748b', off = '#6b7280';
    function b(n, d, name, value, c) { return { n: n, tag: d ? n + ' derived' : n + ' real', tagC: d ? (G === 'dark' ? '#ffb067' : '#7c3a05') : (G === 'dark' ? 'rgba(235,240,248,0.76)' : 'rgba(16,20,27,0.62)'), name: name, value: value, tint: self.rgba(c, 0.3), aria: name + ': ' + value }; }
    return [
      b('1', false, 'Ceiling Lights', '71%', neu),
      b('2', false, 'Kitchen Lights', '71%', kit),
      b('3', true, 'Kitchen Lights', '10%', kit),
      b('4', false, 'Bed Light', 'Off', off),
      b('5', true, 'Office RGBW Lights', 'Unavailable', off),
      b('6', true, 'Ceiling Lights', '71%', neu),
      b('7', true, 'Entrance Color + White Lights', 'On', neu),
      b('8', true, 'Living Room Lights', '71%', neu)
    ];
  }
  renderVals() {
    return { dk: this.list('dark'), lt: this.list('light') };
  }
}
</script>
</body>
</html>
