<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Room card with lights</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b0e14}
.lc{font-family:'Inter',system-ui,-apple-system,sans-serif;color:#F4F6FA;-webkit-font-smoothing:antialiased;font-feature-settings:'tnum' 1}
.g-dark{--lc-fg:#f4f6fa;--lc-fg2:rgba(235,240,248,.78);--lc-fg3:rgba(235,240,248,.76);--lc-bg:rgba(18,20,26,.78);--lc-edge:rgba(255,255,255,.12);--lc-shine:rgba(255,255,255,.22);--lc-bright:#ffffff;--lc-btn:rgba(255,255,255,.05);--lc-btn-edge:rgba(255,255,255,.08);--lc-line:rgba(255,255,255,.09);--lc-rim:rgba(255,255,255,.5);--lc-rim2:rgba(255,255,255,.18);--lc-room:rgba(255,255,255,.04);--lc-room-on:rgba(100,140,240,.1);--lc-room-edge:rgba(255,255,255,.07);--lc-room-on-edge:rgba(255,255,255,.26);color:var(--lc-fg)}
.g-light{--lc-fg:#10141b;--lc-fg2:rgba(16,20,27,.62);--lc-fg3:rgba(16,20,27,.62);--lc-bg:rgba(248,249,252,.72);--lc-edge:rgba(0,0,0,.1);--lc-shine:rgba(255,255,255,.7);--lc-bright:#10141b;--lc-btn:rgba(0,0,0,.04);--lc-btn-edge:rgba(0,0,0,.08);--lc-line:rgba(0,0,0,.1);--lc-rim:rgba(255,255,255,.9);--lc-rim2:rgba(255,255,255,.4);--lc-room:rgba(255,255,255,.55);--lc-room-on:rgba(255,255,255,.7);--lc-room-edge:rgba(16,20,27,.08);--lc-room-on-edge:rgba(16,20,27,.3);color:var(--lc-fg)}
.cluster{position:relative;box-sizing:border-box;width:780px;padding:24px;border-radius:36px;display:flex;flex-direction:column;gap:18px;color:var(--lc-fg);background:var(--lc-bg);-webkit-backdrop-filter:blur(30px) saturate(170%);backdrop-filter:blur(30px) saturate(170%);border:1px solid var(--lc-edge);box-shadow:inset 0 1px 0 var(--lc-shine),0 40px 80px -24px rgba(0,0,0,.65)}
.rim::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(140deg,var(--lc-rim),rgba(255,255,255,0) 35%,rgba(255,255,255,0) 65%,var(--lc-rim2));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(100px)}
button{font:inherit;color:inherit;cursor:pointer;margin:0;border:1px solid var(--lc-btn-edge);background:var(--lc-btn)}
button:focus-visible{outline:2px solid var(--lc-bright);outline-offset:2px}
.press{transition:transform .3s cubic-bezier(.3,1.7,.5,1),background-color .5s ease,border-color .5s ease}
.press:active{transform:scale(.96)}
.room{box-sizing:border-box;min-width:0;border-radius:26px;padding:16px;display:flex;flex-direction:column;align-items:stretch;gap:4px;text-align:left;background:var(--lc-room);border-color:var(--lc-room-edge)}
.room.sel{background:var(--lc-room-on);border-color:var(--lc-room-on-edge)}
.round{width:44px;height:44px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;flex:none}
.sq{width:44px;height:44px;border-radius:14px;padding:0;display:flex;align-items:center;justify-content:center}
@media (prefers-reduced-motion:reduce){.press{transition:none}}
</style>
</helmet>
<div class="lc" style="width: 880px; height: 1240px; position: relative; overflow: hidden; background: #0b0e14; display: grid; grid-template-rows: 1fr 1fr">
  <sc-for list="{{panels}}" as="p" hint-placeholder-count="2">
    <section style="position: relative; overflow: hidden; background: {{p.ground}}; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 12px">
      <sc-if value="{{p.orbs}}" hint-placeholder-val="{{ true }}">
        <div class="orb" aria-hidden="true" style="width: 520px; height: 520px; left: -140px; top: 40px; background-color: #24324a; opacity: 0.8"></div>
        <div class="orb" aria-hidden="true" style="width: 460px; height: 460px; right: -120px; bottom: -120px; background-color: #1d3a3a; opacity: 0.7"></div>
      </sc-if>
      <span style="position: relative; width: 780px; font-size: 13px; color: {{p.capC}}">{{p.cap}}</span>
      <section class="cluster rim {{p.g}}" aria-label="Living Room lights">
        <header style="display: flex; align-items: center; justify-content: space-between; gap: 16px">
          <div style="display: flex; align-items: baseline; gap: 12px">
            <h2 style="margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.02em">Living Room</h2>
            <span style="font-size: 13px; color: var(--lc-fg2)">1 of 3 on</span>
          </div>
          <button class="press round" aria-label="Turn off Living Room Lights" aria-pressed="true" style="background: {{p.grpBg}}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v10 M18.4 6.6a9 9 0 1 1-12.77.04"></path></svg>
          </button>
        </header>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
          <sc-for list="{{p.rooms}}" as="r" hint-placeholder-count="3">
            <button class="room press {{r.sel}}" aria-pressed="{{r.pressed}}" aria-label="{{r.aria}}" style="opacity: {{r.op}}">
              <span style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
                <span style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span>
                <span style="display: flex; flex: none; color: {{r.c}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5 M9 18h6 M10 22h4"></path></svg></span>
              </span>
              <span style="display: flex; align-items: flex-start; justify-content: center; padding: 22px 0 18px">
                <span style="font-size: 44px; font-weight: 200; letter-spacing: -0.04em; line-height: 1">{{r.big}}</span>
                <span style="font-size: 18px; font-weight: 300; margin-top: 4px; color: var(--lc-fg2)">{{r.unit}}</span>
              </span>
              <span style="font-size: 12px; color: var(--lc-fg3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.foot}}</span>
            </button>
          </sc-for>
        </div>
        <div style="display: grid; grid-template-columns: minmax(96px, 150px) minmax(0, 1fr) auto; align-items: center; gap: 12px 16px; border-top: 1px solid var(--lc-line); padding-top: 16px">
          <button aria-haspopup="dialog" aria-label="Open Ceiling Lights, on, 2631 K" style="min-width: 0; min-height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 8px; margin-left: -8px; border: none; background: none; text-align: left; border-radius: 12px">
            <span style="min-width: 0; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 15px; font-weight: 600; white-space: nowrap">Ceiling Lights</span>
              <span style="font-size: 12px; color: var(--lc-fg3)">On, 2631 K</span>
            </span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: var(--lc-fg2)"><path d="M9 6l6 6-6 6"></path></svg>
          </button>
          <div role="group" aria-label="Ceiling Lights colour mode" style="display: flex; gap: 6px">
            <button class="press sq" aria-label="White" aria-pressed="true" style="background: {{p.wBg}}; border-color: {{p.wBd}}; color: var(--lc-bright)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 1 0 0-8z M12 2v2 M12 20v2 M4.93 4.93l1.41 1.41 M17.66 17.66l1.41 1.41 M2 12h2 M20 12h2 M6.34 17.66l-1.41 1.41 M19.07 4.93l-1.41 1.41"></path></svg>
            </button>
            <button class="press sq" aria-label="Colour" aria-pressed="false" style="color: var(--lc-fg2)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 17a10 10 0 0 0-20 0 M6 17a6 6 0 0 1 12 0 M10 17a2 2 0 0 1 4 0"></path></svg>
            </button>
          </div>
          <div style="display: flex; align-items: center; gap: 8px">
            <button class="press round" aria-label="Lower brightness"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
            <span style="width: 66px; text-align: center; font-size: 24px; font-weight: 300; letter-spacing: -0.03em" aria-live="polite">71%</span>
            <button class="press round" aria-label="Raise brightness"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14 M12 5v14"></path></svg></button>
          </div>
        </div>
      </section>
    </section>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":880,"height":1240}}'>
class Component extends DCLogic {
  rgba(hex, a) {
    var n = parseInt(hex.slice(1), 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }
  panel(G) {
    var self = this;
    var neu = G === 'dark' ? '#d5dce6' : '#64748b';
    function r(name, c, big, unit, foot, sel, op) {
      return { name: name, c: c, big: big, unit: unit, foot: foot, op: op || 1, sel: sel ? 'sel' : '', pressed: sel ? 'true' : 'false', aria: name + ', ' + foot };
    }
    return {
      g: 'g-' + G,
      ground: G === 'dark' ? '#0b0e14' : '#e7e9ee',
      orbs: G === 'dark',
      capC: G === 'dark' ? 'rgba(235,240,248,0.78)' : 'rgba(16,20,27,0.62)',
      cap: (G === 'dark' ? 'Dark' : 'Light') + ' glass. The cluster card with lights in place of climates. Derived: the area, the group, Living Room RGBWW Lights off and Entrance Color + White Lights unavailable. Ceiling Lights neutral (CHO-1 option B).',
      grpBg: self.rgba(neu, 0.28),
      wBg: self.rgba(neu, 0.24), wBd: self.rgba(neu, 0.45),
      rooms: [
        r('Ceiling Lights', neu, '71', '%', 'On, 2631 K', true),
        r('Living Room RGBWW Lights', 'var(--lc-fg3)', 'Off', '', 'Off', false),
        r('Entrance Color + White Lights', 'var(--lc-fg3)', '--', '', 'Unavailable', false, 0.5)
      ]
    };
  }
  renderVals() {
    return { panels: [this.panel('dark'), this.panel('light')] };
  }
}
</script>
</body>
</html>
